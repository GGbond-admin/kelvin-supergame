<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="SUPERGAME — 官方客服联系入口">
  <meta name="theme-color" content="#07070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SUPERGAME</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #07070b;
      --ink: #f7f1e4;
      --muted: rgba(247, 241, 228, 0.55);
      --faint: rgba(247, 241, 228, 0.32);
      --gold: #e2b84a;
      --gold-hi: #f6d978;
      --red: #c91f35;
      --wechat: #07c160;
      --whatsapp: #25d366;
      --telegram: #2aabee;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: var(--bg);
    }

    .scene__glow {
      position: absolute;
      left: 50%;
      top: -8%;
      width: 120%;
      max-width: 560px;
      aspect-ratio: 1;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 50% 40%, rgba(201, 31, 53, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 50% 55%, rgba(226, 184, 74, 0.14) 0%, transparent 50%);
      filter: blur(2px);
    }

    .scene__mesh {
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(226, 184, 74, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(226, 184, 74, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 55% at 50% 28%, #000 10%, transparent 75%);
    }

    .scene__vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 75% 70% at 50% 40%, transparent 35%, rgba(0, 0, 0, 0.72) 100%);
    }

    .page {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      height: 100%;
      height: 100dvh;
      margin: 0 auto;
      padding:
        calc(24px + var(--safe-t))
        calc(22px + var(--safe-r))
        calc(20px + var(--safe-b))
        calc(22px + var(--safe-l));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    /* Brand block — logo is the hero */
    .brand {
      text-align: center;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand__mark {
      position: relative;
      display: block;
      width: min(100%, 300px);
      margin: 0 auto 18px;
    }

    .brand__mark::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 55%;
      width: 70%;
      height: 45%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(226, 184, 74, 0.28) 0%, transparent 70%);
      filter: blur(18px);
      z-index: 0;
    }

    .brand__logo {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.45));
    }

    .brand__meta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(226, 184, 74, 0.18);
      background: rgba(226, 184, 74, 0.06);
    }

    .brand__flags {
      display: inline-flex;
      gap: 5px;
      font-size: 15px;
      line-height: 1;
    }

    .brand__region {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Contact block */
    .contacts {
      animation: rise 0.7s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .contacts__label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .contacts__label span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .contacts__label::before,
    .contacts__label::after {
      content: '';
      width: 28px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(226, 184, 74, 0.55));
    }

    .contacts__label::after {
      background: linear-gradient(90deg, rgba(226, 184, 74, 0.55), transparent);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      --accent: var(--gold);
      position: relative;
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 64px;
      padding: 12px 14px 12px 12px;
      border: none;
      border-radius: 18px;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      font: inherit;
      cursor: pointer;
      background:
        linear-gradient(#121218, #121218) padding-box,
        linear-gradient(135deg, rgba(246, 217, 120, 0.55), rgba(201, 31, 53, 0.35), rgba(226, 184, 74, 0.2)) border-box;
      border: 1px solid transparent;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      touch-action: manipulation;
      animation: rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .item:nth-child(1) { animation-delay: 0.18s; }
    .item:nth-child(2) { animation-delay: 0.26s; }
    .item:nth-child(3) { animation-delay: 0.34s; }
    .item:nth-child(4) { animation-delay: 0.42s; }

    .item:active {
      transform: scale(0.985);
    }

    @media (hover: hover) {
      .item:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(226, 184, 74, 0.12);
        filter: brightness(1.06);
      }
    }

    .item--wechat   { --accent: var(--wechat); }
    .item--whatsapp { --accent: var(--whatsapp); }
    .item--telegram { --accent: var(--telegram); }
    .item--channel  { --accent: var(--gold-hi); }

    .item__icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--accent) 16%, #0a0a10);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .item__icon svg {
      width: 24px;
      height: 24px;
      fill: var(--accent);
    }

    .item__copy {
      min-width: 0;
    }

    .item__name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .item__sub {
      margin-top: 3px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item__action {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      white-space: nowrap;
    }

    .item--wechat .item__action {
      color: color-mix(in srgb, var(--wechat) 80%, white);
      border-color: color-mix(in srgb, var(--wechat) 30%, transparent);
      background: color-mix(in srgb, var(--wechat) 12%, transparent);
    }

    .foot {
      text-align: center;
      animation: rise 0.7s 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .foot__live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--faint);
    }

    .foot__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--wechat);
      box-shadow: 0 0 0 0 rgba(7, 193, 96, 0.45);
      animation: pulse 2s ease-out infinite;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + var(--safe-b));
      z-index: 50;
      transform: translateX(-50%) translateY(16px);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 40px);
      padding: 13px 18px;
      border-radius: 14px;
      background: rgba(14, 14, 20, 0.94);
      border: 1px solid rgba(7, 193, 96, 0.35);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast svg {
      width: 18px;
      height: 18px;
      fill: var(--wechat);
      flex-shrink: 0;
    }

    .toast p {
      font-size: 13.5px;
      font-weight: 600;
    }

    .toast strong {
      color: var(--wechat);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(7, 193, 96, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(7, 193, 96, 0); }
      100% { box-shadow: 0 0 0 0 rgba(7, 193, 96, 0); }
    }

    @media (max-width: 360px) {
      .page {
        gap: 22px;
        padding-left: calc(16px + var(--safe-l));
        padding-right: calc(16px + var(--safe-r));
      }

      .brand__mark { width: min(100%, 260px); }

      .item {
        grid-template-columns: 44px 1fr auto;
        gap: 11px;
        min-height: 58px;
        padding: 10px 10px 10px 10px;
        border-radius: 16px;
      }

      .item__icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }

      .item__icon svg {
        width: 22px;
        height: 22px;
      }

      .item__name { font-size: 14px; }
      .item__action { font-size: 10px; padding: 6px 8px; }
    }

    @media (min-width: 480px) {
      .brand__mark { width: 320px; }
      .item { min-height: 68px; padding: 14px 16px 14px 14px; }
      .item__name { font-size: 16px; }
      .item__sub { font-size: 13px; }
    }

    @media (max-height: 640px) {
      .page {
        justify-content: flex-start;
        gap: 20px;
        padding-top: calc(20px + var(--safe-t));
      }
      .brand__mark { width: min(100%, 240px); margin-bottom: 12px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .page {
        width: min(100%, 640px);
        flex-direction: row;
        align-items: center;
        gap: 28px;
        padding-top: calc(16px + var(--safe-t));
        padding-bottom: calc(16px + var(--safe-b));
      }
      .brand { flex: 0 0 42%; }
      .brand__mark { width: 100%; margin-bottom: 12px; }
      .contacts { flex: 1; }
      .foot { display: none; }
    }
  </style>
</head>
<body>

  <div class="toast" id="toast" role="status" aria-live="polite">

    <p>已复制微信号：<strong>supergame777</strong></p>
  </div>

  <script>
    /* Lock viewport drag / rubber-band bounce on mobile */
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturestart', (e) => e.preventDefault());

    const wechat = document.getElementById('wechat');
    const toast = document.getElementById('toast');
    let timer;

    wechat.addEventListener('click', async () => {
      const id = wechat.dataset.copy;
      try {
        await navigator.clipboard.writeText(id);
      } catch {
        const el = document.createElement('textarea');
        el.value = id;
        el.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
      }
      clearTimeout(timer);
      toast.classList.add('show');
      timer = setTimeout(() => toast.classList.remove('show'), 2400);
    });
  </script>
